<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="400" height="200" viewBox="0 0 400 200">
  <style>.status { fill: rgb(34, 197, 94); stroke: rgb(3, 4, 5); stroke-width: 2; } .inherited { color: rgb(0, 0, 255); } text { font: 12px sans-serif; }</style>
  <defs>
    <linearGradient id="gradient"><stop stop-color="red"/><stop offset="1" stop-color="blue"/></linearGradient>
    <marker id="arrowhead" markerWidth="3" markerHeight="3" refX="2" refY="1.5" orient="auto"><path d="M0,0 L3,1.5 L0,3 Z"/></marker>
    <g id="resource-icon"><rect width="8" height="8" fill="orange"/></g>
  </defs>
  <g id="layer" transform="translate(10 20)">
    <rect id="frame" x="0" y="0" width="280" height="150" fill="none" stroke="gray"/>
    <text id="heading" x="5" y="15">External inputs</text>
    <a href="/d/original?var-node=alpha&amp;from=now-3h">
      <g id="cell-alpha" data-cell-id="alpha">
        <rect id="alpha-shape" class="status" x="10" y="25" width="80" height="30" fill-opacity="0.8" stroke-opacity="0.6"/>
        <text x="15" y="45">Service Alpha</text>
      </g>
    </a>
    <g id="cell-beta" data-cell-id="beta" class="inherited">
      <circle id="static-green" cx="150" cy="40" r="10" fill="rgb(34, 197, 94)"/>
      <text x="170" y="35"><tspan x="170">Service</tspan><tspan x="170" dy="15">Beta</tspan></text>
      <foreignObject id="html-label" x="115" y="65" width="80" height="45"><div xmlns="http://www.w3.org/1999/xhtml" style="font: 12px sans-serif; color: inherit">HTML <b>label</b><br/>second line</div></foreignObject>
    </g>
    <path id="cell-link-alpha-beta" data-cell-id="edge-alpha" d="M90 40 L135 40" fill="none" stroke="purple" marker-end="url(#arrowhead)"/>
    <rect id="cell-table" x="10" y="70" width="60" height="15" fill="url(#gradient)"/>
    <g id="mixed"><rect x="5" y="110" width="10" height="10" fill="red"/><rect x="20" y="110" width="10" height="10" fill="blue"/></g>
    <text x="200" y="90">Unbound caption</text>
    <use id="icon-instance" href="#resource-icon" x="240" y="110"/>
    <image id="image-heading" x="260" y="110" width="10" height="10"/>
    <g id="hidden" style="display:none"><text>Not displayed</text></g>
  </g>
</svg>
